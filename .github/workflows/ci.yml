name: CI - Build, Test, Push to ECR

on:
  push:
    branches:
      - develop
      - staging
      - main

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: nexvion

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set environment name from branch
        id: vars
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "ENV_NAME=prod" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref_name }}" = "staging" ]; then
            echo "ENV_NAME=staging" >> $GITHUB_OUTPUT
          else
            echo "ENV_NAME=dev" >> $GITHUB_OUTPUT
          fi

      - name: Lint HTML
        run: |
          npx htmlhint "application/*.html" || true

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ steps.vars.outputs.ENV_NAME }}-${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG ./application

      - name: Run Trivy security scan
        uses: aquasecurity/trivy-action@master
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ steps.vars.outputs.ENV_NAME }}-${{ github.sha }}
        with:
          image-ref: '${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

      - name: Push image to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ steps.vars.outputs.ENV_NAME }}-${{ github.sha }}
        run: |
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          echo "Pushed image: $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

  update-infra:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Set environment name from branch
        id: vars
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "ENV_NAME=prod" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref_name }}" = "staging" ]; then
            echo "ENV_NAME=staging" >> $GITHUB_OUTPUT
          else
            echo "ENV_NAME=dev" >> $GITHUB_OUTPUT
          fi

      - name: Checkout infra repo
        uses: actions/checkout@v4
        with:
          repository: pixelopscloud/ai-ecommerce-devops-infra
          token: ${{ secrets.INFRA_REPO_TOKEN }}
          ref: develop
          path: infra

      - name: Update image tag in values file
        env:
          ENV_NAME: ${{ steps.vars.outputs.ENV_NAME }}
          IMAGE_TAG: ${{ steps.vars.outputs.ENV_NAME }}-${{ github.sha }}
        run: |
          cd infra
          sed -i "s|tag: .*|tag: ${IMAGE_TAG}|" helm/nexvion/values-${ENV_NAME}.yaml
          cat helm/nexvion/values-${ENV_NAME}.yaml

      - name: Commit and push changes
        run: |
          cd infra
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add helm/nexvion/values-*.yaml
          git commit -m "Update image tag for ${{ steps.vars.outputs.ENV_NAME }}" || echo "No changes to commit"
          git push origin develop
